# Base de producción para Donweb (sección 19 del plan). Requiere completar
# variables reales en `.env` (NUNCA versionado) y provisionar TLS antes de
# exponer el dominio público (ver checklist en README.md).
name: eventradar-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - eventradar_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eventradar_internal
    # Sin `ports:`: no se expone al host, solo accesible por la red interna.

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      ENVIRONMENT: production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eventradar_internal
    # Sin `ports:`: solo accesible a través de `nginx`.

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${BACKEND_PUBLIC_URL}
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - eventradar_internal

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx:/etc/nginx/conf.d:ro
      # Certificados TLS (ej. Certbot). No se provisionan en esta
      # inicialización: pendiente (checklist "dominio y TLS" del informe).
      - eventradar_certs:/etc/letsencrypt:ro
    networks:
      - eventradar_internal

networks:
  eventradar_internal:
    driver: bridge

volumes:
  eventradar_postgres_data:
  eventradar_certs:
