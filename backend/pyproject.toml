[project]
name = "eventradar-backend"
version = "0.1.0"
description = "EventRadar backend — monolito modular (FastAPI + Tortoise ORM + Aerich)."
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
# readme = "../README.md"

dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "tortoise-orm[asyncpg]>=0.21,<0.22",
    "aerich>=0.7,<0.8",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "asyncpg>=0.29,<0.30",
    "httpx>=0.27,<0.28",
    "python-json-logger>=2.0,<3.0",
    "APScheduler>=3.10,<3.11",
    "rapidfuzz>=3.9,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.6,<0.7",
    "mypy>=1.11,<2.0",
    "asgi-lifespan>=2.1,<3.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.aerich]
tortoise_orm = "app.config.TORTOISE_ORM"
location = "./migrations"
src_folder = "./."

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
plugins = []
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
disallow_untyped_defs = false
exclude = ["migrations"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: requires a real PostgreSQL database (TEST_DATABASE_URL)",
    "llm_smoke: requires a real LLM endpoint (RUN_LLM_SMOKE_TESTS=1), section 18.2 'smoke real'",
]
