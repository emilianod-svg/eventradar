# Plantilla de reverse proxy para Donweb (sección 19 del plan).
#
# PENDIENTE antes de usar en producción (ver checklist del informe de
# inicialización):
#   1. DNS de eventradar.net.ar apuntando al servidor de Donweb.
#   2. Certificado TLS (ej. `certbot --nginx` o equivalente).
#   3. Descomentar el bloque HTTPS y el redirect de HTTP->HTTPS.
#
# Mientras tanto, este archivo sirve tráfico HTTP plano para poder validar
# el despliegue antes de tener el dominio/TLS confirmados.

upstream eventradar_backend {
    server backend:8000;
}

upstream eventradar_frontend {
    server frontend:8080;
}

server {
    listen 80;
    server_name eventradar.net.ar www.eventradar.net.ar;

    # --- Descomentar una vez emitido el certificado ---
    # return 301 https://$host$request_uri;

    location /api/ {
        proxy_pass http://eventradar_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://eventradar_backend;
    }

    location /ready {
        proxy_pass http://eventradar_backend;
    }

    location / {
        proxy_pass http://eventradar_frontend;
        proxy_set_header Host $host;
    }
}

